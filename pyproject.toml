[project]
name = "craft-gate"
version = "0.1.0"
description = "Craftsmanship catalog + Tidy First ratchet + craftCov scanner"
requires-python = ">=3.10"
dependencies = [
    # render_catalog.py and craftcov.py both parse catalog.yaml.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The detector engines craftcov.py shells out to. Split from the base
# dependency on purpose: catalog.yaml/CRAFTSMANSHIP.md tooling (render,
# ratchet, report) needs only PyYAML; scanning needs these too, and they're
# heavier (a full lint/dead-code-analysis toolchain), so a consuming repo
# that only wants the ratchet + catalog isn't forced to install them.
craftcov = [
    "ruff>=0.13",
    "pylint>=3.3",
    "vulture>=2.14",
]
# scripts/check_complexity_ratchet.py's engines — split from craftcov on
# purpose, same reasoning: a repo that only wants some of the default CI
# gates isn't forced to install every gate's toolchain.
complexity = [
    "radon>=6.0",
    "cognitive-complexity>=1.3",
]

[tool.uv]
package = false  # a dependency anchor for `uv sync` / `uv run`, not a distributable library

[tool.ruff]
line-length = 100  # every consuming repo checked so far (kai-ster, semanticdiff,
# semanticlint) independently settled on 100 — scripts/*.py are copied
# verbatim into those repos, so matching it here means a consumer never has
# to re-lint/reformat what bootstrap.sh gives it against its own house style.

[tool.ruff.lint]
# The intersection every consuming repo checked so far enables — narrower
# than any one of them, so passing here means passing everywhere, not
# tuned to one repo's particular select/ignore list.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
