name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repo eats its own dog food: catalog.yaml must parse, the scripts
  # must be valid shell, and its own commit history must follow the ratchet
  # it ships to everyone else.
  validate:
    name: Validate catalog + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: catalog.yaml parses, ids are unique
        run: |
          python3 -c "
          import yaml
          data = yaml.safe_load(open('catalog.yaml'))
          ids = [d['id'] for d in data]
          assert len(ids) == len(set(ids)), 'duplicate id in catalog.yaml'
          for d in data:
              assert d.get('kind') in {'tidying', 'smell-fix', 'principle', 'workflow'}, d
              assert d.get('source'), f\"missing source: {d['id']}\"
          print(f'{len(data)} entries OK')
          "

      - name: shell scripts parse
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK $f"
          done

      - name: CRAFTSMANSHIP.md is regenerated from catalog.yaml
        run: python3 scripts/render_catalog.py --check

      - name: craftcov.py compiles, catalog detector rules are well-formed
        run: |
          python3 -m py_compile scripts/craftcov.py
          python3 scripts/craftcov.py --list-detectors > /dev/null
          echo "OK"

      - name: format_sarif produces a well-formed SARIF 2.1.0 document
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from craftcov import format_sarif

          catalog = [
              {'id': 'dead-code', 'code': 'CG002', 'name': 'Dead Code', 'smell': 'unused', 'action': 'delete it', 'detectors': [{'tool': 'ruff', 'rules': ['F401']}]},
              {'id': 'metzs-rules', 'code': 'CG030', 'name': 'Metz', 'kind': 'principle'},  # no detectors -> excluded from rules
          ]
          by_file = {'a.py': [{'line': 3, 'col': 0, 'heuristic_id': 'dead-code', 'heuristic_code': 'CG002'}]}
          doc = format_sarif(by_file, catalog)

          assert doc['version'] == '2.1.0'
          run = doc['runs'][0]
          rule_ids = {r['id'] for r in run['tool']['driver']['rules']}
          assert rule_ids == {'dead-code'}, rule_ids  # only detectable entries become rules
          [result] = run['results']
          assert result['ruleId'] == 'dead-code'
          assert result['level'] == 'warning'
          assert result['locations'][0]['physicalLocation']['artifactLocation']['uri'] == 'a.py'
          assert result['locations'][0]['physicalLocation']['region']['startLine'] == 3

          print('format_sarif OK')
          "

      - name: check_refactor_first.py compiles
        run: |
          python3 -m py_compile scripts/check_refactor_first.py
          echo "OK"

      - name: check_complexity_ratchet.py compiles, pure-logic functions are correct
        run: |
          python3 -m py_compile scripts/check_complexity_ratchet.py
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from check_complexity_ratchet import find_violations, compute_duplicate_literals
          from pathlib import Path
          import tempfile

          # a function pushed over threshold, and a new one born over threshold, both fire
          base = {'a.py::f': 10}
          head = {'a.py::f': 20, 'a.py::g': 16}
          v = find_violations(base, head, threshold=15)
          assert len(v) == 2, v
          assert 'a.py::f' in v[0] and '10' in v[0] and '20' in v[0]
          assert 'a.py::g' in v[1] and 'new function' in v[1]

          # untouched (no touched= given): unchanged-and-already-bad, or refactored
          # down, neither fires -- the only signal available without diff info
          assert find_violations({'a.py::f': 20}, {'a.py::f': 20}, threshold=15) == []
          assert find_violations({'a.py::f': 20}, {'a.py::f': 12}, threshold=15) == []

          # touched + still >= base: violation even when unchanged, not just when worse
          vt = find_violations({'a.py::f': 20}, {'a.py::f': 20}, threshold=15, touched={'a.py::f'})
          assert len(vt) == 1 and 'unchanged' in vt[0], vt
          # touched + genuinely decreased (even if still over threshold): allowed
          assert find_violations({'a.py::f': 20}, {'a.py::f': 18}, threshold=15, touched={'a.py::f'}) == []
          # not in touched set: falls back to the untouched rule regardless
          assert find_violations({'a.py::f': 20}, {'a.py::f': 20}, threshold=15, touched=set()) == []

          # duplicated-string-literal needs no radon/cognitive-complexity (pure ast)
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / 'x.py').write_text('a = \"hello world\"\nb = \"hello world\"\nc = \"hello world\"\n')
              dup = compute_duplicate_literals(root)
              assert any('hello world' in k for k in dup), dup

          print('check_complexity_ratchet.py OK')
          "

      - name: craftcov_pr_comment.py compiles, render_markdown is correct
        run: |
          python3 -m py_compile scripts/craftcov_pr_comment.py
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from craftcov_pr_comment import render_markdown, MARKER

          # a heuristic appearing for the first time is tagged NEW, one that
          # disappeared entirely is tagged RESOLVED, an unchanged one is omitted
          base = {'total': 10, 'by_heuristic': {'dead-code': 5, 'explaining-constant': 5}}
          head = {'total': 8, 'by_heuristic': {'dead-code': 3, 'explaining-constant': 5}}
          catalog_by_id = {'dead-code': {'code': 'CG002'}, 'explaining-constant': {'code': 'CG009'}}
          body = render_markdown(base, head, catalog_by_id, None, 'abc123')
          assert body.startswith(MARKER)
          assert 'dead-code' in body and '5' in body and '3' in body
          assert 'explaining-constant' not in body  # unchanged -> not in the diff at all

          resolved = render_markdown({'total': 5, 'by_heuristic': {'dead-code': 5}}, {'total': 0, 'by_heuristic': {}}, catalog_by_id, None, 'abc123')
          assert '✅' in resolved

          new = render_markdown({'total': 0, 'by_heuristic': {}}, {'total': 3, 'by_heuristic': {'dead-code': 3}}, catalog_by_id, None, 'abc123')
          assert '🆕' in new

          # --repo pins the doc link to this exact commit, not a branch name
          linked = render_markdown(base, head, catalog_by_id, 'gbelbe/craft-gate', 'abc123')
          assert 'https://github.com/gbelbe/craft-gate/blob/abc123/CRAFTSMANSHIP.md' in linked

          print('craftcov_pr_comment.py OK')
          "

      - name: dupes algorithm smoke test (no external tool needed)
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from craftcov import strip_lines_for_dupes, find_duplicate_blocks

          # comments/blanks stripped, a '#' inside a string not mistaken for one
          stripped = strip_lines_for_dupes('x = 1  # comment\n\n\ny = \"a # b\"\n')
          assert stripped == [(1, 'x = 1'), (4, 'y = \"a # b\"')], stripped

          # a real 4-line duplicate across two files is found exactly
          filtered = {
              'a.py': [(1, 'def f():'), (2, 'x = 1'), (3, 'y = 2'), (4, 'return x + y'), (5, 'z = 9')],
              'b.py': [(10, 'x = 1'), (11, 'y = 2'), (12, 'return x + y'), (13, 'z = 9')],
          }
          blocks = find_duplicate_blocks(filtered, min_lines=4)
          assert len(blocks) == 1, blocks
          b = blocks[0]
          assert b['lines'] == 4, b
          assert {b['start_a'], b['start_b']} == {2, 10}, b
          assert {b['end_a'], b['end_b']} == {5, 13}, b

          # below the threshold: no match
          assert find_duplicate_blocks(filtered, min_lines=5) == []

          # import statements are excluded from the scan entirely: two files
          # that only share their import block (no shared logic) must not
          # be flagged as duplicated code — they share a library, not code
          # this repo wrote.
          imports_only_a = 'import os\nimport sys\nfrom pathlib import Path\n\ndef f():\n    return 1\n'
          imports_only_b = 'import os\nimport sys\nfrom pathlib import Path\n\ndef g():\n    return 2\n'
          filtered_imports = {
              'a.py': strip_lines_for_dupes(imports_only_a),
              'b.py': strip_lines_for_dupes(imports_only_b),
          }
          assert find_duplicate_blocks(filtered_imports, min_lines=3) == [], find_duplicate_blocks(filtered_imports, min_lines=3)

          # a multi-line parenthesized import has ALL of its lines excluded,
          # not just the first — real duplicated logic right after it is
          # still found, starting after the import.
          multiline_import = 'from typing import (\n    Any,\n    Dict,\n)\n\ndef h(x):\n    if x is None:\n        return None\n    return x + 1\n'
          stripped_multiline = strip_lines_for_dupes(multiline_import)
          assert stripped_multiline[0] == (6, 'def h(x):'), stripped_multiline

          print('dupes algorithm OK')
          "

      - name: next_version.py bump-level logic (smoke test, no pytest dependency)
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from next_version import bump_level, next_version

          assert bump_level(['feat: x']) == 'minor'
          assert bump_level(['fix: x']) == 'patch'
          assert bump_level(['docs: x']) == None
          assert bump_level(['feat!: x']) == 'major'
          assert bump_level(['fix: x\n\nBREAKING CHANGE: y']) == 'major'
          assert bump_level(['feat: x', 'fix: y']) == 'minor'  # highest wins
          assert next_version(None, 'minor') == '0.1.0'
          assert next_version('v0.1.0', 'minor') == '0.2.0'
          assert next_version('v0.1.0', 'patch') == '0.1.1'
          assert next_version('v0.9.0', 'major') == '0.10.0'  # 0.x stays 0.x
          assert next_version('v1.2.3', 'major') == '2.0.0'
          print('next_version.py OK')
          "

      - name: templates/*.yml and templates/*.yaml are valid YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('templates/pre-commit-hook.yaml')); print('pre-commit-hook.yaml OK')"
          python3 -c "import yaml; yaml.safe_load(open('templates/update-check.yml')); print('update-check.yml OK')"
          python3 -c "
          import yaml
          # ci-job.yml is a fragment (a single job, indented as if under 'jobs:'),
          # not a standalone workflow — wrap it before parsing.
          body = open('templates/ci-job.yml').read()
          wrapped = 'jobs:\n' + body
          yaml.safe_load(wrapped)
          print('ci-job.yml fragment OK')
          "

  # Full end-to-end dogfood: real ruff/pylint/vulture invocations, not just
  # --list-detectors' metadata check above. Separate job so the fast
  # metadata-only validate job above doesn't wait on a uv sync.
  craftcov:
    name: craftCov full scan (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      # scripts/*.py ship verbatim into every consuming repo (bootstrap.sh
      # copies them byte-for-byte) — anything this select would catch here
      # (an unused import, a stray f-string prefix, a bare `raise` inside
      # except, a line over this repo's line-length = 100) only ever
      # surfaces downstream otherwise, as a consumer's own ruff config
      # failing on a file it never wrote — caught the hard way twice
      # already. The select is the intersection every consumer this has
      # actually shipped to (kai-ster, semanticdiff, semanticlint) enables
      # — narrower than any one of them, so passing here means passing
      # everywhere, not aimed at one repo's particular ignore list. See
      # pyproject.toml's [tool.ruff] comment for line-length.
      - name: scripts/*.py pass the rules every consumer repo enables
        run: |
          uv run ruff check scripts/*.py
          uv run ruff format --check scripts/*.py

      # Note: this now includes tests/fixtures/ (deliberately smelly ground
      # truth, see below) — most of the findings below are those files
      # working exactly as designed, not real debt in this repo's own
      # source. The ground-truth test right after this is the real check.
      - name: Real scan (ruff + pylint + vulture) against this repo
        run: uv run python3 scripts/craftcov.py --no-cache

      - name: Ground-truth regression (tests/fixtures/ — every detector fires correctly)
        run: uv run python3 tests/test_fixtures.py

  # Diff-aware: only meaningful against a PR's base branch.
  tidy:
    name: Tidy First ratchet (dogfood)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Tidy First ratchet: a tidy(<type>) / test(characterize) commit or Tidy-Exempt trailer"
        run: bash scripts/check_tidy_ratchet.sh --base "origin/${{ github.base_ref }}"

  # Diff-aware like `tidy` above, but a mechanical count check rather than a
  # commit-message pattern — needs the full craftcov toolchain (it re-scans
  # both the PR head and the merge-base tree), so it's its own job rather
  # than a step in the fast, dependency-free `tidy` job above.
  refactor-first:
    name: Refactor First gate (dogfood)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: "Refactor First: touched files' detectable-heuristic total must go down (or stay 0)"
        run: uv run python3 scripts/check_refactor_first.py --base "origin/${{ github.base_ref }}"

  # Independent of craftCov — own script, own catalog entries (CG032-
  # CG035), own toolchain (radon, cognitive-complexity).
  complexity:
    name: Complexity ratchet (dogfood)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra complexity
        run: uv sync --extra complexity

      - name: "Complexity ratchet: cyclomatic/cognitive complexity, invariant return, duplicated literal"
        run: uv run python3 scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

  # Reporting, not a gate, but part of the default setup — see
  # templates/ci-job.yml's own comment.
  craftcov-pr-comment:
    name: craftCov PR report (dogfood)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Post/update the craftCov PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python3 scripts/craftcov_pr_comment.py \
            --base "origin/${{ github.base_ref }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

  # Reporting, not a gate, but part of the default setup — see
  # templates/ci-job.yml's own comment. Public repo here, so code scanning
  # is available with no extra licensing.
  craftcov-sarif:
    name: Upload craftCov SARIF (dogfood)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Generate craftCov SARIF
        run: uv run python3 scripts/craftcov.py --format sarif --no-cache --no-diff > craftcov.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: craftcov.sarif
          category: craftcov
