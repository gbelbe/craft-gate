# Add this job to your .github/workflows/ci.yml if you want it — optional,
# not part of craft-gate's default six jobs (templates/ci-job.yml), because
# mutation testing is fundamentally more expensive than every gate there: it
# reruns your test suite once per mutant. Needs `mutmut` (craft-gate's own
# `mutation` extra, or add it to your own dependency file) plus your own
# test-running deps, and a `mutants/` cache between runs to stay fast — see
# the cache step below, keyed on source content so it invalidates correctly.
#
# check_mutation_ratchet.py reads mutmut's own results (`mutmut run` itself
# always exits 0 regardless of survivors — it isn't the gate) and a git
# diff, and fails only when a function *this PR's diff touches* has a
# mutation score below --threshold. Flat floor, not base-vs-head like the
# complexity ratchet — running mutation testing twice per PR is too
# expensive to default to. See DESIGN.md's "Mutation ratchet" for the full
# rationale, and CRAFTSMANSHIP.md's "Mutation ratchet" for how to raise a
# genuinely equivalent mutant (`# pragma: no mutate`, mutmut's own escape
# hatch — not a Tidy-Exempt: trailer, which bypasses this whole gate rather
# than one specific finding).
#
# 80 is a starting point, calibrated against nothing repo-specific yet —
# lower it if your first real run's honest score is well below that; the
# point is a floor your team can actually hit, not an arbitrary import.

  mutation-ratchet:
    name: Mutation ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch for the diff

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra mutation --extra dev   # ← plus whatever installs your own test deps
        run: uv sync --extra mutation --extra dev

      - name: Cache mutmut results
        uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: mutmut-${{ runner.os }}-

      - name: mutmut run
        run: uv run mutmut run

      - name: "Mutation ratchet: touched functions' mutation score"
        run: |
          uv run python3 scripts/check_mutation_ratchet.py \
            --base "origin/${{ github.base_ref }}" \
            --threshold 80
