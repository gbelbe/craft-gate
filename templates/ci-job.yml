# Add all seven jobs below to your .github/workflows/ci.yml — the default
# setup this tool ships. The first five are enforcement gates
# (CRAFTSMANSHIP.md's "The ratchet", "Refactor First", "The complexity
# ratchet", "Patch coverage", and "Mutation ratchet"); the last two are
# reporting, not gates (neither fails a build) but are part of the default
# setup too — see their own comments below for the two real exceptions
# (craftcov-sarif needs a public repo or GitHub Advanced Security).
# Set the branch name in the places marked below — and, for patch-coverage
# specifically, your own package name (see its own comment). Mutation-ratchet
# needs `[tool.mutmut]` source paths in your own pyproject.toml.
#
# All five gates skip bot-authored PRs (dependabot, renovate, etc. — any
# actor ending in `[bot]`): those tools can't write a `tidy(<type>)` commit
# or a `Tidy-Exempt:` trailer, and a dependency bump has no craftsmanship
# heuristic — or new untested code — to apply/introduce anyway. A skipped
# job still reports a passing check, so this doesn't loosen branch
# protection for anyone else.
#
# On by default, opt out per repo: every gate here is meant to be adopted,
# but none is universal — delete the one job block that doesn't fit your
# repo (patch-coverage and mutation-ratchet both need a real pytest suite;
# mutation-ratchet specifically also needs the runtime budget for it — see
# its own comment) rather than leaving it in a state it can never pass.

  tidy:
    name: Tidy First ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base branch and full commit history

      - name: "Tidy First ratchet: a tidy(<type>) / test(characterize) commit or Tidy-Exempt trailer"
        run: bash scripts/check_tidy_ratchet.sh --base "origin/${{ github.base_ref }}"

# A separate job, not a step in `tidy` above, because it's a real CI pass —
# it needs craftCov's toolchain (`uv sync --extra craftcov`; see DESIGN.md's
# craftCov section and pyproject.toml's `craftcov` extra) where `tidy` above
# needs nothing beyond bash. Fails a PR when a touched .py file's total
# across the 8 mechanically-detectable heuristics didn't go down (or,
# starting from 0, went up at all) — see CRAFTSMANSHIP.md's "Refactor First".
  refactor-first:
    name: Refactor First gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: "Refactor First: touched files' detectable-heuristic total must go down (or stay 0)"
        run: uv run python3 scripts/check_refactor_first.py --base "origin/${{ github.base_ref }}"

# Independent of craftCov — its own script, its own catalog entries
# (CG032-CG035), its own dependency extra (`uv sync --extra complexity`;
# see DESIGN.md's "The complexity ratchet"). Fails a PR when a touched
# function/literal's cyclomatic/cognitive complexity, invariant-return, or
# duplicated-string-literal metric got worse than where the branch
# diverged — grandfathers what's already there, blocks what gets worse.
  complexity:
    name: Complexity ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra complexity
        run: uv sync --extra complexity

      - name: "Complexity ratchet: cyclomatic/cognitive complexity, invariant return, duplicated literal"
        run: uv run python3 scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

# Unlike the three gates above, this one doesn't call a script craft-gate
# ships — it wires up `pytest --cov` + diff-cover (github.com/Bachmann1234/
# diff_cover), both third-party, against *your own* test suite. There is no
# generic default here: fill in `--cov=<your_package>` below, and add
# `diff-cover` (plus your coverage runner, if you don't already have one) to
# your dev dependencies. `--fail-under 90` is the starting point CRAFTSMANSHIP.md
# documents, not a mandated number — change it to match your own repo's bar.
# Fails when the diff's *changed* lines are under-covered; a repo that's
# 40% covered overall still passes here as long as every line this PR
# touches is well-tested — the point is not letting new debt accumulate,
# not retroactively demanding full coverage of everything that exists.
#
# If you already have a job that runs `pytest --cov ... --cov-report=xml`
# (a lint-and-test job, a matrix job, whatever) — add the "Patch coverage"
# step below to THAT job instead of using this standalone one. This job
# reruns your whole suite a second time just to get a second coverage.xml;
# that's the right shape only when nothing else already produces one.
# Verified against three real adoptions: two repos had an existing
# coverage-producing job and got the step embedded there for free; one had
# none and got this job as-is. See CRAFTSMANSHIP.md's "Patch coverage".
  patch-coverage:
    name: Patch coverage (diff-cover)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base branch for diff-cover's --compare-branch

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra dev
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov=<your_package> --cov-report=xml   # ← set your package

      - name: "Patch coverage: changed lines must be ≥ 90% covered"
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 90

# The one gate here that doesn't call a script craft-gate ships either — it
# wires up mutmut (github.com/boxed/mutmut), third-party, against *your own*
# test suite. Reruns your tests once per mutant, so it's the most expensive
# job in this file by a wide margin; the cache step below is what keeps
# repeat runs fast (mutmut's own incremental caching does the rest). Fails
# when a function *this diff touches* has a mutation score below
# --threshold (80 is a starting point, not a mandate — see CRAFTSMANSHIP.md's
# "Mutation ratchet"). No Tidy-Exempt: bypass, same reasoning as
# patch-coverage; a genuinely equivalent mutant gets mutmut's own
# `# pragma: no mutate` instead.
#
# Configure `[tool.mutmut]` in the consuming project's pyproject.toml before
# installing the default gate. The dependency is part of the default dev
# toolchain and the local runner uses the same cached `mutants/` directory.
# Recommended config:
#   source_paths = ["your_package"]
#   # Keep mutation runs focused; the normal CI test job still runs the full suite.
#   pytest_add_cli_args_test_selection = ["tests/unit/test_feature.py", "-m", "mutation"]
#   # Keep source_paths/only_mutate limited to the production contracts those tests cover.
#   cache_invalidation_files = ["tests/**/*.py", "conftest.py"]
#   on_dependency_change = "rerun"
  mutation-ratchet:
    name: Mutation ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base branch for the diff

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra mutation --extra dev   # ← plus whatever installs your own test deps
        run: uv sync --extra mutation --extra dev

      - name: Cache mutmut results
        uses: actions/cache@v6
        with:
          path: mutants
          key: mutmut-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'uv.lock') }}
          restore-keys: mutmut-${{ runner.os }}-

      - name: mutmut run
        run: uv run mutmut run

      - name: "Mutation ratchet: touched functions' mutation score"
        run: |
          uv run python3 scripts/check_mutation_ratchet.py \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --threshold 80 \
            --improvement 20

# ── Reporting, not enforcement — but still part of the default setup ────────
# Neither job fails a build; both make what the gates above found visible
# where you're already looking, instead of just a CI log.

# Posts (or updates in place) a sticky PR comment showing craftCov's
# repo-wide total and its by-heuristic breakdown, diffed against where the
# branch diverged — see DESIGN.md's Reporting section and
# scripts/craftcov_pr_comment.py's own docstring. Needs `pull-requests:
# write` (not just the default `read`) to post/edit the comment.
  craftcov-pr-comment:
    name: craftCov PR report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Post/update the craftCov PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python3 scripts/craftcov_pr_comment.py \
            --base "origin/${{ github.base_ref }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

# Uploads craftCov's findings to GitHub's own code-scanning dashboard —
# history, per-finding tracking, and a native alert count, instead of a
# hand-rolled report needing its own hosting. Needs `security-events:
# write`, and — the one real exception to this being on by default —
# either a PUBLIC repo or GitHub Advanced Security on a private one; code
# scanning silently isn't available otherwise, so skip just this one job
# if neither applies. Runs on push to your default branch, not every PR,
# since the point is tracking the branch's actual current state over time.
  craftcov-sarif:
    name: Upload craftCov SARIF
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Generate craftCov SARIF
        run: uv run python3 scripts/craftcov.py --format sarif --no-cache --no-diff > craftcov.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: craftcov.sarif
          category: craftcov
