# Add this job to your .github/workflows/ci.yml. Text-only check on commit
# messages — no deps to install, no build — so it costs seconds, not a real
# CI pass. Set the branch name in the two places marked below.

  tidy:
    name: Tidy First ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch and full commit history

      - name: "Tidy First ratchet: a tidy(<type>) / test(characterize) commit or Tidy-Exempt trailer"
        run: bash scripts/check_tidy_ratchet.sh --base "origin/${{ github.base_ref }}"
