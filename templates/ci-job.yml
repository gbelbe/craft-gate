# Add all five jobs below to your .github/workflows/ci.yml — the default
# setup this tool ships. The first three are enforcement gates
# (CRAFTSMANSHIP.md's "The ratchet", "Refactor First", and "The complexity
# ratchet"); the last two are reporting, not gates (neither fails a build)
# but are part of the default setup too — see their own comments below for
# the one real exception (craftcov-sarif needs a public repo or GitHub
# Advanced Security). Set the branch name in the places marked below.
#
# All three gates skip bot-authored PRs (dependabot, renovate, etc. — any
# actor ending in `[bot]`): those tools can't write a `tidy(<type>)` commit
# or a `Tidy-Exempt:` trailer, and a dependency bump has no craftsmanship
# heuristic to apply anyway. A skipped job still reports a passing check,
# so this doesn't loosen branch protection for anyone else.

  tidy:
    name: Tidy First ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch and full commit history

      - name: "Tidy First ratchet: a tidy(<type>) / test(characterize) commit or Tidy-Exempt trailer"
        run: bash scripts/check_tidy_ratchet.sh --base "origin/${{ github.base_ref }}"

# A separate job, not a step in `tidy` above, because it's a real CI pass —
# it needs craftCov's toolchain (`uv sync --extra craftcov`; see DESIGN.md's
# craftCov section and pyproject.toml's `craftcov` extra) where `tidy` above
# needs nothing beyond bash. Fails a PR when a touched .py file's total
# across the 8 mechanically-detectable heuristics didn't go down (or,
# starting from 0, went up at all) — see CRAFTSMANSHIP.md's "Refactor First".
  refactor-first:
    name: Refactor First gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: "Refactor First: touched files' detectable-heuristic total must go down (or stay 0)"
        run: uv run python3 scripts/check_refactor_first.py --base "origin/${{ github.base_ref }}"

# Independent of craftCov — its own script, its own catalog entries
# (CG032-CG035), its own dependency extra (`uv sync --extra complexity`;
# see DESIGN.md's "The complexity ratchet"). Fails a PR when a touched
# function/literal's cyclomatic/cognitive complexity, invariant-return, or
# duplicated-string-literal metric got worse than where the branch
# diverged — grandfathers what's already there, blocks what gets worse.
  complexity:
    name: Complexity ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra complexity
        run: uv sync --extra complexity

      - name: "Complexity ratchet: cyclomatic/cognitive complexity, invariant return, duplicated literal"
        run: uv run python3 scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

# ── Reporting, not enforcement — but still part of the default setup ────────
# Neither job fails a build; both make what the gates above found visible
# where you're already looking, instead of just a CI log.

# Posts (or updates in place) a sticky PR comment showing craftCov's
# repo-wide total and its by-heuristic breakdown, diffed against where the
# branch diverged — see DESIGN.md's Reporting section and
# scripts/craftcov_pr_comment.py's own docstring. Needs `pull-requests:
# write` (not just the default `read`) to post/edit the comment.
  craftcov-pr-comment:
    name: craftCov PR report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Post/update the craftCov PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python3 scripts/craftcov_pr_comment.py \
            --base "origin/${{ github.base_ref }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

# Uploads craftCov's findings to GitHub's own code-scanning dashboard —
# history, per-finding tracking, and a native alert count, instead of a
# hand-rolled report needing its own hosting. Needs `security-events:
# write`, and — the one real exception to this being on by default —
# either a PUBLIC repo or GitHub Advanced Security on a private one; code
# scanning silently isn't available otherwise, so skip just this one job
# if neither applies. Runs on push to your default branch, not every PR,
# since the point is tracking the branch's actual current state over time.
  craftcov-sarif:
    name: Upload craftCov SARIF
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Generate craftCov SARIF
        run: uv run python3 scripts/craftcov.py --format sarif --no-cache --no-diff > craftcov.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: craftcov.sarif
          category: craftcov
